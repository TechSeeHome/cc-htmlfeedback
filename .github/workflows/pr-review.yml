# Adapted from the org rollout template (scripts/rollout-pr-review.sh in techsee-pr-reviewer).
#
# This repo is PUBLIC, so per the template's security note the trigger is `pull_request`
# (NOT pull_request_target): fork PRs get no secrets and no write token. The same-repo guard
# below additionally skips fork PRs outright, since the review step cannot work without
# CURSOR_API_KEY anyway.
name: AI PR Review
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  review:
    # Only same-repo PRs: fork PRs have no access to CURSOR_API_KEY, so the job would just fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Headroom for checkout + Cursor CLI install before the cursor_timeout (500s) review window.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout PR Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Cursor CLI
        env:
          CURSOR_INSTALL_URL: https://cursor.com/install
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl -fsS "$CURSOR_INSTALL_URL" -o "$tmp"
          bash "$tmp"

      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Cursor CLI
        run: command -v cursor-agent && cursor-agent --version

      - name: AI Code Review
        uses: TechSeeHome/techsee-pr-reviewer@v3
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
          cursor_timeout: 500
          exclude_patterns: '**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,plugins/**,*.min.js,*.bundle.js,package-lock.json,.DS_Store,*.pptx,*.xlsx,*.pdf,*.csv,*.pem'
